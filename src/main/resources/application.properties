spring.application.name=hila-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/hila}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hila}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hila_local_only}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=Hila API
info.app.description=Plataforma de coordinación de voluntariado

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
