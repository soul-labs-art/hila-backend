spring.application.name=hila-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5433/hila}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:hila}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:hila_local_only}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=Hila API
info.app.description=Plataforma de coordinación de voluntariado

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Identity / local development
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m
spring.mail.host=${SMTP_HOST:127.0.0.1}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
spring.jackson.deserialization.fail-on-unknown-properties=true
hila.outbox-key=${OUTBOX_ENCRYPTION_KEY:development-only-replace-before-real-data}
hila.web-origin=${WEB_ORIGIN:http://127.0.0.1:5173}
hila.storage.provider=${STORAGE_PROVIDER:local}
hila.storage.directory=${STORAGE_DIRECTORY:./.hila-media}
hila.storage.endpoint=${R2_ENDPOINT:}
hila.storage.bucket=${R2_BUCKET:}
hila.storage.access-key=${R2_ACCESS_KEY_ID:}
hila.storage.secret-key=${R2_SECRET_ACCESS_KEY:}

spring.jackson.deserialization.fail-on-missing-creator-properties=true
hila.policy.version=${POLICY_VERSION:dev-1}
hila.policy.content=${POLICY_CONTENT:Entorno local para pruebas. No introduzcas datos personales reales.}
hila.policy.alerts-content=${ALERTS_POLICY_CONTENT:Avisos del entorno de pruebas.}
