services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hila}
      POSTGRES_USER: ${POSTGRES_USER:-hila}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hila_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hila} -d ${POSTGRES_DB:-hila}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:8025:8025"

  api:
    build:
      context: .
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:5173}
      OUTBOX_ENCRYPTION_KEY: ${OUTBOX_ENCRYPTION_KEY:-development-only-replace-before-real-data}
      STORAGE_DIRECTORY: /app/media
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/hila}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-hila}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-hila_local_only}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - profile_media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  profile_media:
